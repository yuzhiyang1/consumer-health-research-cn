strategy:
  name: "ns_agent"
  max_linearization_tokens: 4000

  # ==========================================
  # 调试策略配置
  # ==========================================
  # 线性化算法的选择：
  # - “ greedy” (默认显著性包)
  # - 时间学( 时间顺序已打包)
  linearization_strategy: "greedy"

  # 选择性禁用代理函数：
  enabled_tools:
    - "inspect_node"
    - "search_graph"
    - "follow_links"
    - "filter_graph_by_time"