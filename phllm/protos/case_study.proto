edition = "2023";

// 这个原型旨在支持AI健身教练的研究。

package phllm_protos;

import "third_party/tensorflow/core/example/feature.proto";

option features.utf8_validation = NONE;

// 用户提供了与案例研究相关的投入。
message UserInput {
  // 用于用户交互的“ Tags” ;此交互的短名。
  // 示例预想的标签：“任务用户对睡眠的认知”
  // 这实际上是一个打字松散的圆柱，为下游提供了灵活性。
  string tag = 1;

  // 向用户显示收集反馈的提示。可能不会
  // 如果用户提供的数据不及时，则必然存在。
  string prompt = 2;

  // 用户提供的答复(可能自由格式)
  string response = 3;
}

// 与本案例研究相关的特征，可以标记为命名间隔。
// 我们使用 TF 特性让我们可以编码一个 百日词典，允许
// 将任意数据放置在特性中。
message Feature {
  // 此特性集的标签:例如 ` daily_summaries'
  string tag = 1;

  // 这只是一个字符串地图 ->tf.Features.
  // 未提供明确的时间戳字段。假定这将
  // 被嵌入到特性中。
  tensorflow.Features tensors = 2;
}

// 顶级案例研究数据结构。
message CaseStudy {
  // 本案例研究的标识符。
  string case_study_id = 1;

  // 本案例研究可提供的其他特点包括：
  // 上下文数据，或时间序列。
  repeated Feature contextual_features = 2;

  // 与本案例研究有关的用户投入。
  repeated UserInput user_inputs = 3;
}
