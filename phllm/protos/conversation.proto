edition = "2023";

// 对话原型包含与一种(可能的多种模式)有关的数据。
// 与语言模型或人类专家的一组互动。
//  - 可以通过下列途径与最初的个案研究投入结合起来进行交谈：
//    联合 国 `case_study_id` .
//  -每次谈话都包含一个顺序的 `Message` s
//    与原 case_study 的元素通过 `tag` 合并。
package phllm_protos;

option features.enum_type = CLOSED;
option features.utf8_validation = NONE;

// /谈话与信息。

// 用户提供了反馈。
message Feedback {
  enum Type {
    FEEDBACK_TYPE_UNSPECIFIED = 0;
    POSITIVE = 1;
    NEGATIVE = 2;
  }

  Type type = 1;

  // 类别一般只在提供负面反馈时才指定。
  string category = 2;

  // 用户提供反馈，通常只提供负面反馈。
  string text = 3;
}

// 信件组件
message Chunk {
  oneof value {
    string text = 1;
    Feedback feedback = 2;

    // Base64 编码了图像，以包含在信件中。这可能会
    // 成为 多模态 模型的输入图像，或生成/传递的图像
    // 作为产出的一部分。
    string image_base64 = 3;
  }
}

// 谈话中只有一条消息
message Message {
  // 用于调试的此信件的可选元数据/ 标记信息
  string tag = 1;

  // 指派给消息的共同消息角色。
  enum Role {
    UNKNOWN_ROLE = 0;

    // 系统指令或命令在对话前进行，例如：
    // "助手应该礼貌和有帮助"
    SYSTEM = 1;

    // 用户在用户和助手间的对话中输入。
    USER = 2;

    // 助理在用户和助理之间对话中的答复。
    ASSISTANT = 3;

    // 与这次对话有关的补充文件或资料。
    CONTEXT = 4;

    // 关于地面真相笔记/由人类提供的答复
    GRADER = 5;

    // 用户提供了反馈。
    USER_FEEDBACK = 6;
  }

  Role role = 2;

  // 命令的信息组成块。
  repeated Chunk chunks = 3;

  // 此消息的模型所分配的分数。
  // NOTE :这是依赖模型的。通常，得分是象日志，但要小心
  // 应在申请中解释分数。
  float score = 4;
}

message Conversation {
  // 案例研究的独特识别特征来自这一对话。
  string case_study_id = 1;

  // 这是这次谈话的独有标识。
  string conversation_id = 2;

  // 包含这次谈话的有序消息。
  // 先前的电文在下文中包含，用于随后的电文。
  repeated Message messages = 3;
}
